---
- name: Copy files
  ansible.builtin.copy:
    src: "jaeger/"
    dest: /root/k8s/jaeger/
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o=r"

- name: Set a configs
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o=r"
  loop:
    - src: jaeger_values.yaml.j2
      dest: /root/k8s/jaeger_values.yaml

- name: getpods from namespace jaeger
  ansible.builtin.shell:
    cmd: kubectl get pods -n jaeger
  ignore_errors: true
  register: getpods_jaeger

- name: Display getpods_jaeger
  ansible.builtin.debug:
    msg: "{{ getpods_jaeger }}"

- name: Install Jager
  ansible.builtin.shell:
    cmd: |
      kubectl -n es exec -it master-0 -c opensearch -- keytool -import -trustcacerts -keystore trust.store -storepass changeit -alias es-root -file config/certs/ca.crt
      kubectl -n es exec -it master-0 -c opensearch -- cat config/certs/ca.crt > es.pem
      kubectl -n es cp master-0:trust.store trust.store -c opensearch
      base64 trust.store > trust.store.b64
      kubectl -n jaeger create configmap opensearch-tls --from-file=trust.store.b64 --from-file=es.pem
      kubectl -n jaeger create secret generic opensearch-secret --from-literal=ES_PASSWORD=admin
      helm install jaeger /root/k8s/jaeger/ -f /root/k8s/jaeger_values.yaml -n jaeger
  ignore_errors: true
  when: "'No ' in getpods_jaeger.stdout"

- name: Install Jager
  ansible.builtin.shell:
    cmd: |
      helm upgrade jaeger /root/k8s/jaeger/ -f /root/k8s/jaeger_values.yaml -n jaeger
  ignore_errors: true
  when: "not 'No ' in getpods_jaeger.stdout"

