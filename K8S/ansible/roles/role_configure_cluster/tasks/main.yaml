---
- name: Set a configs master
  template: 
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - src: set_priority.yaml.j2
      dest: /root/k8s/set_priority.yaml
      owner: root
      group: root
      mode: u=rw,g=r,o=r

- name: Set priorityClassName
  ansible.builtin.shell:
    cmd: |
      kubectl apply -f /root/k8s/set_priority.yaml

- name: Add labels for create a default disk on a specific set of nodes
  ansible.builtin.shell:
    cmd: >-
      kubectl label nodes {{ item }}
      --overwrite node.longhorn.io/create-default-disk='config'
  with_items: "{{ groups['workers'] }}"

- name: Add node annotations
  ansible.builtin.shell:
    cmd: >-
      kubectl annotate nodes {{ item }} 
      --overwrite node.longhorn.io/default-disks-config='[ { "name":"disk", "path":"/mnt/data", "allowScheduling":true, "tags":[ "ssd", "hdd" ] }]'
  with_items: "{{ groups['workers'] }}"